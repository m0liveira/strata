name: React Native CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Linting check
              run: npm run lint

            - name: TypeScript Check
              run: npx tsc

            - name: Run Unit Tests
              run: npm test
